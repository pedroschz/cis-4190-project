[project]
name = "cis-4190-project"
version = "0.1.0"
description = "CIS 4190/5190 Final Project - Track B: News Source Classification (Fox vs NBC)"
requires-python = ">=3.11,<3.13"
authors = [{ name = "CIS 5190 Team" }]
readme = "README.md"

dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=9.0",
    "tqdm>=4.66",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=1.0",
    "evaluate>=0.4",
]
notebook = [
    "jupyter>=1.0",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
